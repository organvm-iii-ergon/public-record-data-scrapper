name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'functions/**'
      - 'scripts/prepare-cloudflare-pages.mjs'
      - 'scripts/__tests__/cloudflare-pages.test.mjs'
      - 'scripts/no-mock-runtime.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Cloudflare Pages environment'
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: 'Type DEPLOY for production'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'push' && 'staging' || inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Use the canonical npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Install frozen dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
      - name: Select an authorized Pages target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            target=staging
          else
            target="$REQUESTED_TARGET"
          fi
          if [ "$target" = production ]; then
            test "$CONFIRM" = DEPLOY
            project=ucc-mca-dashboard
          else
            test "$target" = staging
            project=ucc-mca-dashboard-staging
          fi
          echo "environment=$target" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
      - name: Verify the authenticated Pages package
        run: |
          node --test scripts/__tests__/cloudflare-pages.test.mjs
          node scripts/no-mock-runtime.mjs
          npm run typecheck
      - name: Build the root-based SPA
        env:
          VITE_API_BASE_URL: /api
        run: npm --workspace apps/web run build -- --base=/
      - name: Prepare the environment-bound Pages package
        id: package
        env:
          TARGET: ${{ steps.target.outputs.environment }}
          PROJECT: ${{ steps.target.outputs.project }}
        run: |
          package="$(node scripts/prepare-cloudflare-pages.mjs "$TARGET" "$PROJECT")"
          test -f "$package/dist/index.html"
          test -f "$package/functions/_middleware.js"
          echo "dir=$package" >> "$GITHUB_OUTPUT"
      - name: Require an accepted main revision
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Deploy the exact Pages revision
        working-directory: ${{ steps.package.outputs.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.target.outputs.project }}
        run: |
          ../../../cloudflare/node_modules/.bin/wrangler pages deploy dist \
            --project-name "$PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA"
      - name: Verify the Cloudflare deployment receipt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.target.outputs.project }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments" \
            > .quality/pages-deployments.json
          jq --arg sha "$GITHUB_SHA" -e \
            '.success == true and any(.result[]; .deployment_trigger.metadata.commit_hash == $sha and .latest_stage.status == "success")' \
            .quality/pages-deployments.json
