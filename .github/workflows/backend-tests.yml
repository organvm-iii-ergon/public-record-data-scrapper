name: Backend Tests

on:
  workflow_call:
  push:
    branches: ['**']
  pull_request:
    branches:
      - main
      - master
      - develop
      - lane/verify
      - lane/heal
      - lane/expand-public-records
      - lane/evolve-platform

jobs:
  test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ucc_intelligence_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ucc_intelligence_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ucc_intelligence_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Use the canonical npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        # BullMQ and ioredis are already declared in the committed workspace lock.
        run: npm ci --ignore-scripts

      - name: Run database migrations
        run: npm run migrate

      - name: Run database integration tests with rollback isolation
        run: npm run test:database

      - name: Run isolated server tests and enforce coverage
        run: npm run test:server:strict -- --run --coverage

      - name: Upload coverage to Codecov
        # TODO: SHA-pin this action (could not resolve offline). Pin codecov/codecov-action to a full release SHA.
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        # TODO: SHA-pin this action (could not resolve offline). Pin romeovs/lcov-reporter-action to a full release SHA.
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
