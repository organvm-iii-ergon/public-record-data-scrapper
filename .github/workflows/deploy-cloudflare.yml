# ============================================================================
# Deploy ucc-mca-edge (Cloudflare Workers)
# ----------------------------------------------------------------------------
# Strangler-pattern edge deploy, fully scoped to the cloudflare/ directory.
#   * push to main          → auto-deploy to STAGING
#   * workflow_dispatch      → staging retry, or production with confirm == DEPLOY
#
# Secrets required (repo or environment scope):
#   CLOUDFLARE_API_TOKEN   — least-privilege token. Grant ONLY:
#                            Account · Workers Scripts:Edit,
#                            Account · D1:Edit, Account · Workers KV Storage:Edit,
#                            Account · Workers R2 Storage:Edit (+ Account:Read),
#                            Access: Apps and Policies:Edit, Access: Organizations:Read.
# Credential source/delivery is owned by Limen CLAVIS, issue #320.
# Account-wide Access organization creation and paid-plan changes are never automatic.
#                            Do NOT use a Global API Key.
# The API-verified account ID is non-secret and checked by both resolvers.
# ============================================================================
name: deploy-cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'scripts/*cloudflare*'
      - '.github/workflows/deploy-cloudflare.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'scripts/*cloudflare*'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a PRODUCTION deploy'
        required: false
        default: ''
      staging:
        description: 'Provision and deploy the current main revision to STAGING'
        type: boolean
        default: false

# Least privilege: the deploy needs only repo read.
permissions:
  contents: read
  actions: read

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Use the canonical npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Frozen edge install
        working-directory: cloudflare
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source without credentials
        run: |
          node scripts/check-migration-versions.mjs
          node scripts/verify-cloudflare-toolchain.mjs
          node scripts/test-cloudflare-runtime.mjs
          python3 scripts/test_diagnose_cloudflare.py
          python3 scripts/test_verify_cloudflare_staging.py
          python3 scripts/test_provision_cloudflare_staging.py
          python3 scripts/test_verify_cloudflare_live.py
          python3 scripts/test_resolve_cloudflare_production.py
          python3 scripts/test_verify_cloudflare_production.py
          npm --prefix cloudflare run typecheck
          git diff --exit-code -- cloudflare/package.json cloudflare/package-lock.json

  # Provisioning credentials are available only to accepted main, never PR code.
  deploy-staging:
    needs: verify-staging
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.staging && inputs.confirm != 'DEPLOY'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: ucc-cloudflare-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Use the canonical npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Frozen edge install
        working-directory: cloudflare
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require the current accepted main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Reconcile the staging Pages project prerequisite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e0921b840fd656d8ea46426f1f114c30
        run: |
          mkdir -p .quality
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ucc-mca-dashboard-staging"
          status="$(curl --silent --show-error --output .quality/staging-pages-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint")"
          if [ "$status" = 404 ]; then
            status="$(curl --silent --show-error --output .quality/staging-pages-project.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"name":"ucc-mca-dashboard-staging","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
          fi
          test "$status" = 200
          jq -e '.success == true and .result.name == "ucc-mca-dashboard-staging" and .result.production_branch == "main"' \
            .quality/staging-pages-project.json
      - name: Provision or reuse dedicated staging resources
        id: provision_staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=0
          python3 scripts/provision-cloudflare-staging.py --apply || status=$?
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          if [ -f cloudflare/.generated/staging.wrangler.json ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$(jq -r .account_id cloudflare/.generated/staging.wrangler.json)" >> "$GITHUB_ENV"
          fi
      - name: Classify provisioning result
        id: provision_result
        run: python3 scripts/classify-cloudflare-staging-provisioning.py
      - name: Validate the generated staging configuration
        id: configuration
        if: steps.provision_result.outputs.provisioning_ready == 'true'
        run: |
          python3 scripts/verify-cloudflare-live.py --configuration-only
          cd cloudflare
          ./node_modules/.bin/wrangler deploy --config .generated/staging.wrangler.json --dry-run --outdir .generated/bundle
      - name: Apply and verify D1 migrations
        id: migrations
        if: steps.provision_result.outputs.provisioning_ready == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ./node_modules/.bin/wrangler d1 migrations apply DB --config .generated/staging.wrangler.json --remote
          ./node_modules/.bin/wrangler d1 execute DB --config .generated/staging.wrangler.json --remote --command "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name; SELECT name FROM d1_migrations ORDER BY name" --json > .generated/staging-schema.json
      - name: Require the complete migrated schema
        id: schema
        if: steps.provision_result.outputs.provisioning_ready == 'true'
        run: python3 scripts/verify-cloudflare-live.py --schema-only
      - name: Deploy the accepted Worker revision
        id: deploy
        if: steps.provision_result.outputs.provisioning_ready == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          ./node_modules/.bin/wrangler deploy --config .generated/staging.wrangler.json
      - name: Verify live staging identity and authentication boundary
        id: live
        if: steps.provision_result.outputs.provisioning_ready == 'true'
        run: python3 scripts/verify-cloudflare-live.py
      - name: Preserve provisioning and deployment evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloudflare/.generated/staging-provisioning.json
            cloudflare/.generated/staging-deployment.json
            cloudflare/.generated/staging-schema.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Require complete staging deployment acceptance
        if: ${{ always() }}
        env:
          PROVISION_EXIT: ${{ steps.provision_staging.outputs.exit_status }}
          PROVISION_READY: ${{ steps.provision_result.outputs.provisioning_ready }}
          CONFIGURATION: ${{ steps.configuration.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: |
          test "$PROVISION_EXIT" = 0
          test "$PROVISION_READY" = true
          for result in "$CONFIGURATION" "$MIGRATIONS" "$SCHEMA" "$DEPLOY" "$LIVE"; do
            test "$result" = success || exit 1
          done

  # --- PRODUCTION: manual, gated on confirm == DEPLOY -----------------------
  deploy-production:
    needs: verify-staging
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ucc-cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'

      - name: Use the canonical npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund

      - name: Install edge deps
        working-directory: cloudflare
        run: npm ci --ignore-scripts

      - name: Verify locked Cloudflare CLI starts
        run: node scripts/verify-cloudflare-toolchain.mjs

      - name: Confirm frozen dependency declarations
        run: git diff --exit-code -- cloudflare/package.json cloudflare/package-lock.json

      - name: Require the current accepted main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"

      - name: Require same-revision staging Pages acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/runs?branch=main&event=push&status=success&head_sha=$GITHUB_SHA&per_page=10")"
          jq -e --arg sha "$GITHUB_SHA" \
            '.workflow_runs | any(.head_sha == $sha and .event == "push" and .conclusion == "success")' \
            <<< "$receipt"

      - name: Resolve existing isolated production resources
        id: resolution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/resolve-cloudflare-production.py
          echo "CLOUDFLARE_ACCOUNT_ID=e0921b840fd656d8ea46426f1f114c30" >> "$GITHUB_ENV"

      - name: Validate the resolved production configuration
        id: configuration
        run: |
          python3 scripts/verify-cloudflare-production.py --configuration-only
          cd cloudflare
          ./node_modules/.bin/wrangler deploy --config .generated/production.wrangler.json --dry-run --outdir .generated/production-bundle

      - name: Apply D1 migrations (production)
        id: migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e0921b840fd656d8ea46426f1f114c30
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is not configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is not configured}"
          ./node_modules/.bin/wrangler d1 migrations apply DB --config .generated/production.wrangler.json --remote
          ./node_modules/.bin/wrangler d1 execute DB --config .generated/production.wrangler.json --remote --command "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name; SELECT name FROM d1_migrations ORDER BY name" --json > .generated/production-schema.json

      - name: Require the complete production schema
        id: schema
        run: python3 scripts/verify-cloudflare-production.py --schema-only

      - name: Deploy Worker (production)
        id: deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e0921b840fd656d8ea46426f1f114c30
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is not configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is not configured}"
          ./node_modules/.bin/wrangler deploy --config .generated/production.wrangler.json

      - name: Verify exact live production revision and authentication boundary
        id: live
        run: python3 scripts/verify-cloudflare-production.py

      - name: Preserve production promotion evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloudflare/.generated/production-resolution.json
            cloudflare/.generated/production-schema.json
            cloudflare/.generated/production-deployment.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Require complete production promotion acceptance
        if: ${{ always() }}
        env:
          RESOLUTION: ${{ steps.resolution.outcome }}
          CONFIGURATION: ${{ steps.configuration.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: |
          for result in "$RESOLUTION" "$CONFIGURATION" "$MIGRATIONS" "$SCHEMA" "$DEPLOY" "$LIVE"; do
            test "$result" = success || exit 1
          done
